<!doctype html><html lang='sk'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#0b6fc2'><title>Rodinný plán v1.3</title><link rel='manifest' href='manifest.webmanifest'><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17202a;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.top{background:#0873c9;color:white;padding:16px 18px;font-weight:700;font-size:22px;position:sticky;top:0;z-index:3}.wrap{max-width:760px;margin:auto;padding:16px 16px 90px}.date{font-size:26px;font-weight:800;margin:8px 0 16px}.card{background:white;border-radius:18px;margin:12px 0;box-shadow:0 2px 12px #0001;overflow:hidden}.head{display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:750}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:white}.task{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid #eee}.task.done .txt{text-decoration:line-through;opacity:.5}.task input{width:20px;height:20px}.time{min-width:48px;color:#52606d}.txt{flex:1}.del{border:0;background:transparent;font-size:18px;color:#999}.fab{position:fixed;right:22px;bottom:78px;width:58px;height:58px;border-radius:50%;border:0;background:#0873c9;color:white;font-size:34px;box-shadow:0 4px 15px #0004}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:4}.nav button{flex:1;max-width:180px;padding:12px 3px;border:0;background:white;color:#4a5568}.nav .active{color:#0873c9;font-weight:700}.panel{display:none}.panel.active{display:block}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:white;border-radius:12px;min-height:110px;padding:7px;font-size:12px}.day b{display:block;margin-bottom:7px}.chip{padding:5px;border-radius:7px;margin:4px 0;color:#17202a}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:white;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd3da;border-radius:11px;font:inherit}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1;padding:13px;border:0;border-radius:12px;font-weight:700}.save{background:#0873c9;color:white}.cancel{background:#e9eef3}.family input{background:#fff;font-weight:700;padding:10px;border:1px solid #ccd3da}.rename-save{width:auto;padding:9px 12px;border:0;border-radius:10px;background:#0873c9;color:#fff;font-weight:700}.rename-ok{font-size:12px;color:#16803c;font-weight:700;margin-left:4px}.version{font-size:12px;font-weight:500;opacity:.8;margin-left:8px}.empty{padding:30px;text-align:center;color:#718096}@media(max-width:560px){.week{grid-template-columns:1fr}.day{min-height:auto}.row{grid-template-columns:1fr}}
</style></head><body><div class='top'>🏠 Rodinný plán</div><main class='wrap'>
<section id='today' class='panel active'><div class='date' id='todayTitle'></div><div id='todayList'></div></section>
<section id='week' class='panel'><div class='date'>Týždeň</div><div class='week' id='weekGrid'></div></section>
<section id='calendar' class='panel'><div class='date'>Kalendár / všetky úlohy</div><div id='allList'></div></section>
<section id='family' class='panel'><div class='date'>Rodina</div><div class='card family' id='familyList'></div><p style='color:#718096'>Ťukni do mena, prepíš ho a stlač <b>Uložiť</b>. Po uložení sa zobrazí potvrdenie ✓. Zmena sa uloží v tomto zariadení.</p></section>
</main><button class='fab' id='add'>+</button><nav class='nav'><button class='active' data-p='today'>Dnes</button><button data-p='week'>Týždeň</button><button data-p='calendar'>Kalendár</button><button data-p='family'>Rodina</button></nav>
<div class='modal' id='modal'><div class='sheet'><h2>Nová úloha</h2><label>Názov úlohy</label><input id='title' placeholder='napr. Nákup'><div class='row'><div><label>Člen rodiny</label><select id='member'></select></div><div><label>Kategória</label><select id='cat'><option>Domácnosť</option><option>Škola</option><option>Práca</option><option>Nákupy</option><option>Zdravie</option><option>Krúžky / Šport</option><option>Voľný čas</option></select></div></div><div class='row'><div><label>Dátum</label><input id='date' type='date'></div><div><label>Čas</label><input id='time' type='time'></div></div><label>Priorita</label><select id='priority'><option>Nízka</option><option selected>Stredná</option><option>Vysoká</option></select><label>Poznámka</label><textarea id='note' rows='2'></textarea><div class='actions'><button class='cancel' id='cancel'>Zrušiť</button><button class='save' id='save'>Uložiť</button></div></div></div>
<script>
const colors=['#1976d2','#16a05d','#ff641e','#743bd1','#ee2f73'];let members=JSON.parse(localStorage.getItem('rp-members')||'null')||['Imre','Anna','Bence','Kata','Eszter'];let tasks=JSON.parse(localStorage.getItem('rp-tasks')||'[]');const $=s=>document.querySelector(s);const iso=d=>{let z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};const today=iso(new Date());
function saveData(){localStorage.setItem('rp-members',JSON.stringify(members));localStorage.setItem('rp-tasks',JSON.stringify(tasks))}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function memberCard(i,ts){return `<div class='card'><div class='head' style='background:${colors[i]}18'><span class='avatar' style='background:${colors[i]}'>${esc(members[i][0]||'?')}</span>${esc(members[i])}<span style='margin-left:auto'>${ts.length}</span></div>${ts.length?ts.map(t=>taskRow(t)).join(''):`<div class='empty'>Bez úloh</div>`}</div>`}function taskRow(t){return `<div class='task ${t.done?'done':''}'><input type='checkbox' ${t.done?'checked':''} onchange='toggle("${t.id}")'><span class='time'>${esc(t.time||'')}</span><span class='txt'><b>${esc(t.title)}</b>${t.category?`<small> · ${esc(t.category)}</small>`:''}</span><button class='del' onclick='delTask("${t.id}")'>×</button></div>`}
function render(){let d=new Date();$('#todayTitle').textContent='Dnes – '+d.toLocaleDateString('sk-SK',{weekday:'long',day:'numeric',month:'long'});$('#todayList').innerHTML=members.map((m,i)=>memberCard(i,tasks.filter(t=>t.date===today&&t.member==i).sort((a,b)=>(a.time||'').localeCompare(b.time||'')))).join('');renderWeek();$('#allList').innerHTML=tasks.length?tasks.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(t=>`<div class='card'><div class='head'><span class='avatar' style='background:${colors[t.member]}'>${esc(members[t.member]?.[0]||'?')}</span>${esc(members[t.member]||'')} <span style='margin-left:auto'>${esc(t.date)} ${esc(t.time)}</span></div>${taskRow(t)}</div>`).join(''):`<div class='empty'>Zatiaľ nemáš žiadne úlohy.</div>`;$('#familyList').innerHTML=members.map((m,i)=>`<div class='task'><span class='avatar' style='background:${colors[i]}'>${esc(m[0]||'?')}</span><input id='memberName${i}' value='${esc(m)}' aria-label='Meno člena ${i+1}'><button type='button' class='rename-save' onclick='renameFromInput(${i})'>Uložiť</button><span class='rename-ok' id='memberOk${i}'></span></div>`).join('');$('#member').innerHTML=members.map((m,i)=>`<option value='${i}'>${esc(m)}</option>`).join('')}
function renderWeek(){let now=new Date();let day=(now.getDay()+6)%7;let mon=new Date(now);mon.setDate(now.getDate()-day);let out='';for(let x=0;x<7;x++){let d=new Date(mon);d.setDate(mon.getDate()+x);let di=iso(d), ts=tasks.filter(t=>t.date===di);out+=`<div class='day'><b>${d.toLocaleDateString('sk-SK',{weekday:'short',day:'numeric',month:'numeric'})}</b>${ts.map(t=>`<div class='chip' style='background:${colors[t.member]}28;border-left:4px solid ${colors[t.member]}'>${esc(t.time)} ${esc(t.title)}<br><small>${esc(members[t.member])}</small></div>`).join('')||'<span style="color:#aaa">—</span>'}</div>`}$('#weekGrid').innerHTML=out}
window.toggle=id=>{let t=tasks.find(x=>x.id===id);if(t)t.done=!t.done;saveData();render()};window.delTask=id=>{tasks=tasks.filter(x=>x.id!==id);saveData();render()};window.rename=(i,v)=>{const nv=(v||'').trim();if(!nv)return alert('Meno nemôže byť prázdne.');members[i]=nv;saveData();render();setTimeout(()=>{const ok=document.getElementById('memberOk'+i);if(ok)ok.textContent='✓ Uložené';},0)};window.renameFromInput=i=>{const el=document.getElementById('memberName'+i);if(el)window.rename(i,el.value)};
$('.nav').onclick=e=>{if(!e.target.dataset.p)return;document.querySelectorAll('.panel,.nav button').forEach(x=>x.classList.remove('active'));$('#'+e.target.dataset.p).classList.add('active');e.target.classList.add('active')};$('#add').onclick=()=>{$('#date').value=today;$('#modal').classList.add('show')};$('#cancel').onclick=()=>$('#modal').classList.remove('show');$('#save').onclick=()=>{if(!$('#title').value.trim())return alert('Zadaj názov úlohy.');tasks.push({id:Date.now().toString(36),title:$('#title').value.trim(),member:+$('#member').value,date:$('#date').value||today,time:$('#time').value,category:$('#cat').value,priority:$('#priority').value,note:$('#note').value,done:false});saveData();$('#title').value='';$('#time').value='';$('#note').value='';$('#modal').classList.remove('show');render()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
